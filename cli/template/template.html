<!-- Generated by `splatsite build` from manifest.json. Edit the manifest or this template, not the built index.html. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="{{themeColor}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A0F0C'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23FF5B3A' stroke-width='2.5'/><circle cx='16' cy='16' r='3.5' fill='%23FF5B3A'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="scrollcraft.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="theme.css">
<script>document.documentElement.classList.add('js');</script>
<script>window.MMNJ_PAGE = {{config}};</script>
</head>
<body>

<a class="skip" href="#album">Skip to the album</a>
<div class="sc-grain" aria-hidden="true"></div>

<!-- Chrome: the route map is the navigation. One quiet action. -->
<nav class="chrome" aria-label="Route">
  <a class="chrome__mark" id="mark" href="#top">{{mark}}</a>
  <div class="chrome__actions">
    <a class="chrome__cta chrome__cta--viewer" id="viewer-open" href="{{viewerFile}}">Full capture</a>
    <a class="chrome__cta" id="cta" href="#album">Open the album</a>
  </div>
  <div class="map" id="map">
    <canvas class="map__plan" id="map-plan" width="440" height="520" aria-hidden="true"></canvas>
    <div class="map__pins" id="map-pins"></div>
    <p class="map__where" id="map-where" aria-live="polite">The gate</p>
  </div>
</nav>

<!-- The stage: one fixed, live 3D capture of the ground. Scroll walks it. -->
<div class="stage" id="stage" data-sc-verify-state="">
  <picture>
    <source media="(max-width: 860px)" srcset="{{posterMobile}}" width="780" height="1688">
    <img class="stage__poster" id="poster" src="{{posterDesktop}}" width="1440" height="900"
         alt="{{posterAlt}}">
  </picture>
  <canvas class="stage__splat" id="splat" aria-hidden="true"></canvas>
  <div class="stage__pins" id="pins"></div>
  <p class="stage__load" id="load" aria-live="polite"></p>
  <p class="stage__hint" id="look-hint" role="status" hidden></p>
</div>

<!-- Fixed copy layer: type over the world, windowed against the walk. -->
<div class="copy" id="copy">
  <div class="hero-scrim" id="hero-scrim" aria-hidden="true"></div>
  <header class="hero" id="hero">
    <h1 class="hero__title">{{heroA}} <span class="hero__title-b">{{heroB}}</span></h1>
    <p class="hero__lede">{{lede}}</p>
  </header>
  <div class="rise-scrim" id="rise-scrim" aria-hidden="true"></div>
  <p class="line line--rise" id="rise-line">{{riseLine}}</p>
</div>


<div class="album-veil" id="album-veil" aria-hidden="true"></div>

<!-- The album: every photo grouped by spot, one caption schema. This list is
     the page's data: walk.js builds the pins and the waypoints from it. It is
     generated from the page manifest by tools/build-pages.mjs. Without
     JavaScript it is simply the album, under the poster of the ground. -->
<section class="album" id="album" aria-labelledby="album-title">
  <div class="album__inner">
    <h2 class="album__title" id="album-title">{{albumTitle}}</h2>
    <ol class="album__grid" id="album-grid">
{{album}}    </ol>
    <p class="album__colophon">{{colophon}}</p>
{{morePages}}
  </div>
</section>

<!-- The scroll track. walk.js sets its height; it is the only thing in flow. -->
<div class="track" id="track" aria-hidden="true"></div>

<!-- Full-screen photo -->
<dialog class="light" id="light" aria-labelledby="light-title">
  <div class="light__group" id="light-group" hidden>
    <h2 class="light__group-title"><span id="light-group-name"></span> <span class="light__group-count" id="light-group-count"></span></h2>
    <div class="light__grid" id="light-grid"></div>
  </div>
  <figure class="light__fig" id="light-fig">
    <img class="light__img" id="light-img" alt="">
    <figcaption class="light__cap"><strong id="light-title"></strong> <span id="light-spot"></span> <span class="light__count" id="light-count"></span></figcaption>
  </figure>
  <button class="light__back" id="light-back" type="button" hidden>All photos</button>
  <button class="light__btn light__close" id="light-close" type="button">
    <span>Close</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="light__btn light__prev" id="light-prev" type="button" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="light__btn light__next" id="light-next" type="button" aria-label="Next photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <a class="light__download" id="light-download" href="#" download>Download</a>
</dialog>

<!-- The full capture in a free orbit viewer -->
<dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
  <canvas class="viewer__canvas" id="viewer-canvas" aria-label="The full 3D capture of the ground. Drag to turn, scroll to zoom, arrow keys to turn and step."></canvas>
  <div class="viewer__bar">
    <h2 class="viewer__title" id="viewer-title">The full capture <span class="viewer__count" id="viewer-count"></span></h2>
    <p class="viewer__hint">Drag to turn · scroll or pinch to zoom · arrow keys</p>
    <button class="viewer__btn" id="viewer-reset" type="button">Reset view</button>
    <button class="viewer__btn viewer__close" id="viewer-close" type="button"><span>Close</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <p class="viewer__status" id="viewer-status" role="status"></p>
</dialog>

<script src="scrollcraft.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/three-addons/","@sparkjsdev/spark":"./vendor/spark.module.js"}}</script>
<script type="module" src="splat.js"></script>
<script type="module" src="walk.js"></script>
<script type="module" src="viewer.js"></script>
</body>
</html>
